name: Publish npm Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag such as v0.2.0
        required: true
        type: string
      dry_run:
        description: Validate npm packaging without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  publish-npm:
    runs-on: ubuntu-24.04
    env:
      TAG_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: skills/gpt-image-2-skill/scripts/package-lock.json
      - name: Install package dependencies
        run: npm ci --prefix skills/gpt-image-2-skill/scripts
      - name: Dry run npm publish
        if: ${{ env.DRY_RUN == 'true' }}
        run: npm publish skills/gpt-image-2-skill/scripts --access public --dry-run
      - name: Publish package
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm publish skills/gpt-image-2-skill/scripts --access public --provenance
      - name: Dispatch post release verify
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh workflow run "Post Release Verify" --repo "${{ github.repository }}" -f version="${TAG_NAME#v}"
