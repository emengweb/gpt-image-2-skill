interface:
  display_name: "GPT Image 2 Skill"
  short_description: "Generate, edit, and remove backgrounds through one TypeScript CLI with flare/sunburst model routing, OpenAI, Codex, and merged local cutout workflows"
  default_prompt: "Use $gpt-image-2-skill to inspect provider and background-removal readiness, keep generation on the speed-first gpt-image-2.5-flare default and reference-image edits on the precision-first gpt-image-2.5-sunburst default (or pass --model / --tier explicitly), choose openai or codex when generating or editing, run standalone or batch background removal when needed, and consume progress events from the TypeScript skill runtime."

policy:
  allow_implicit_invocation: true
