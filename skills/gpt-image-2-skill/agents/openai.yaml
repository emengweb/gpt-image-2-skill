interface:
  display_name: "GPT Image 2 Skill"
  short_description: "通过 TypeScript CLI 生成、编辑和输出原生透明 PNG，支持 flare/sunburst 路由与已有图片抠图"
  default_prompt: "Use $gpt-image-2-skill through its own bundled launcher: resolve the loaded skill directory (the folder containing SKILL.md) and run `node \"<skill_dir>/scripts/gpt_image_2_skill.cjs\"`; never use a PATH or globally installed gpt-image-2-skill CLI and never resolve the launcher from the current working directory. If it reports missing bundled dependencies, initialize this skill copy once with `npm install --omit=dev --no-audit --no-fund --prefix <skill_dir>/scripts`, then retry. Keep ordinary generation and transparent generate on the speed-first gpt-image-2.5-flare default, and reference-image edits or precision requests on gpt-image-2.5-sunburst; an explicit --model always wins and accepts custom names. For transparent generate, request upstream-native transparency and verify the final PNG. Use transparent extract for existing-image cutouts, controlled mattes, chroma, or dual black/white workflows; do not pass removed matte/source options to transparent generate. Choose openai or codex and consume JSON/JSONL results from the TypeScript runtime."

policy:
  allow_implicit_invocation: true
